<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Talos.1875">
  <meta name="description" content="WvW Squad Builder, codé avec ❤️ par Talos.1875.">
  <meta name="keywords" content="Guild Wars 2, GW2, McM, WvW, classes, groupes, build, squad, Talos">
  <meta name="robots" content="index, follow">
  <title>WvW Squad Builder - Guild Wars 2</title>
  <style>
body {
  font-family: 'Segoe UI', Roboto, sans-serif;
  margin: 0;
  padding: 0;
  display: flex;
  background-color: var(--bg);
  color: var(--text);
  transition: background-color 0.3s, color 0.3s;
}

h3 {
  margin-top: 0;
  font-size: 1.2em;
  border-bottom: 1px solid #ccc;
  padding-bottom: 5px;
}

button {
  margin: 5px 5px 5px 0;
  padding: 6px 12px;
  border: none;
  background-color: #0078d7;
  color: white;
  border-radius: 4px;
  cursor: pointer;
  transition: background-color 0.2s;
}

button:hover {
  background-color: #005fa3;
}

#sidebar {
  width: 300px;
  padding: 15px;
  border-right: 1px solid #ccc;
  background-color: var(--bg);
}

#main {
  flex: 1;
  padding: 20px;
}

.icon {
  width: 48px;
  height: 48px;
  margin: 5px;
  cursor: grab;
  border-radius: 6px;
  transition: transform 0.2s;
}

.icon:hover {
  transform: scale(1.1);
}

.group {
  display: flex;
  margin-bottom: 10px;
}

.slot {
  width: 110px;
  min-width: 110px;
  height: 112px;
  border: 2px dashed #aaa;
  margin-right: 5px;
  border-radius: 8px;
  background-color: #f9f9f9;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  transition: background-color 0.2s;
}

.slot:hover {
  background-color: #e0e0e0;
}

.player-name {
  box-sizing: border-box;
  width: 96px;
  max-width: calc(100% - 8px);
  margin: 1px 0 3px;
  padding: 3px 4px;
  border: 1px solid #bbb;
  border-radius: 4px;
  font: 12px 'Segoe UI', sans-serif;
  text-align: center;
  color: #222;
  background: #fff;
}

.dark-mode .player-name {
  color: #f0f0f0;
  background: #2a2a2a;
  border-color: #555;
}

#mode-toggle {
  position: fixed;
  top: 10px;
  right: 10px;
  cursor: pointer;
  font-size: 22px;
  padding: 5px;
  background-color: var(--bg);
  border: 1px solid #ccc;
  border-radius: 50%;
}

.group-number {
  font-size: 16px;
  color: #444;
}
.dark-mode .group-number {
  color: #ccc;
}

#stats {
  padding: 10px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.6;
}

#details {
  margin-top: 10px;
  padding: 10px;
}

.dark-mode {
  --bg: #121212;
  --text: #f0f0f0;
}

.dark-mode .slot {
  background-color: #1e1e1e;
  border-color: #555;
}

.dark-mode .slot:hover {
  background-color: #333;
}

.dark-mode button {
  background-color: #444;
  color: #eee;
}

.dark-mode button:hover {
  background-color: #666;
}

.slot.dropped {
  animation: pulse 0.3s ease;
}

.footer {
  text-align: center;
  padding: 16px;
  font-size: 14px;
  font-family: 'Segoe UI', sans-serif;
  border-top: 1px solid;
  transition: background-color 0.3s, color 0.3s;
}

body.dark-mode .footer {
  background-color: #1a1a1a;
  color: #ccc;
  border-color: #333;
}

body:not(.dark-mode) .footer {
  background-color: #f5f5f5;
  color: #444;
  border-color: #ddd;
}

.footer .heart {
  color: #e25555;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

#custom-compo {
  margin-top: 20px;
  padding: 15px;
  border-radius: 8px;
  font-family: 'Segoe UI', sans-serif;
  max-width: 400px;
}

body.dark-mode #custom-compo {
  background-color: #1e1e1e;
  border: 1px solid #444;
  color: #ddd;
}

body:not(.dark-mode) #custom-compo {
  background-color: #f5f5f5;
  border: 1px solid #ccc;
  color: #333;
}

body.dark-mode #custom-compo h4 {
  margin-bottom: 10px;
  font-size: 16px;
  color: #fff;
  border-bottom: 1px solid #555;
  padding-bottom: 5px;
}

body:not(.dark-mode) #custom-compo h4 {
  margin-bottom: 10px;
  font-size: 16px;
  color: #333;
  border-bottom: 1px solid #ccc;
  padding-bottom: 5px;
}

#custom-compo label {
  display: block;
  margin: 8px 0;
  font-size: 14px;
}

body.dark-mode #custom-compo input[type="number"] {
  width: 60px;
  padding: 4px;
  margin-left: 10px;
  background-color: #2a2a2a;
  border: 1px solid #555;
  border-radius: 4px;
  color: #fff;
}

body:not(.dark-mode) #custom-compo input[type="number"] {
  width: 60px;
  padding: 4px;
  margin-left: 10px;
  background-color: #fff;
  border: 1px solid #ccc;
  border-radius: 4px;
  color: #000;
}

#custom-compo button {
  margin-top: 12px;
  padding: 6px 12px;
  background-color: #0078d7;
  border: none;
  border-radius: 4px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: background-color 0.2s ease;
}

#custom-compo button:hover {
  background-color: #005fa3;
}

#error-popup {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background-color: #ff4d4d;
  color: white;
  padding: 12px 18px;
  border-radius: 6px;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
  font-size: 14px;
  z-index: 1000;
  animation: fadeIn 0.3s ease;
}

#success-popup {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background-color: #4ba600;
  color: white;
  padding: 12px 18px;
  border-radius: 6px;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
  font-size: 14px;
  z-index: 1000;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

  </style>
</head>
<body>
  <div id="mode-toggle">🌓</div>
  <div id="sidebar"><br />
    <h3>Classes</h3>
	<div id="filters">
	  <strong>Filtrer par rôle :</strong><br>
	  <button onclick="filterIcons('All')">Tous</button>
	  <button onclick="filterIcons('Support')">Support</button>
	  <button onclick="filterIcons('Healer')">Healer</button>
	  <button onclick="filterIcons('Boon')">Boon</button>
	  <button onclick="filterIcons('DPS')">DPS</button>
	</div>
    <div id="icons"></div>
  </div>
  <div id="main">
    <div class="controls">
      <button onclick="addGroup()">➕ Groupe</button>
      <button onclick="removeGroup()">➖ Groupe</button>
	  <button onclick="resetGroups()">🔄 Reset</button>
	  <button onclick="document.getElementById('importFile').click()">📥 Import</button>
	  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importComposition(event)">
      <button onclick="exportComposition()">📤 Export</button>
	  <button id="export-discord">
	    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png" alt="Discord" style="height: 16px; vertical-align: middle; margin-right: 6px;">
	    Exporter Discord
	  </button>
	  <button id="toggle-saved-compositions" type="button" aria-controls="saved-compositions" aria-expanded="true" onclick="toggleSavedCompositions()">📚 Afficher les compositions</button>
      <div id="saved-compositions" style="margin:12px 0; padding:10px; border:1px solid #ccc; border-radius:8px; display : none;">
        <h4 style="margin:0 0 8px;">Compositions enregistrées dans ce navigateur</h4>
        <label for="composition-name">Nom de la composition :</label>
        <input type="text" id="composition-name" maxlength="80" placeholder="My little squadron" style="box-sizing:border-box;width:100%;padding:6px;margin:4px 0 8px;">
        <button onclick="saveCompositionToStorage()">💾 Enregistrer</button>
        <label for="saved-compositions-list" style="display:block;margin-top:8px;">Compositions sauvegardées :</label>
        <select id="saved-compositions-list" style="box-sizing:border-box;width:100%;padding:6px;margin:4px 0 8px;"></select>
        <button onclick="loadCompositionFromStorage()">📂 Charger</button>
        <button onclick="deleteCompositionFromStorage()">🗑️ Supprimer</button>
      </div>
	  <div id="custom-compo">
	    <h4>Personnaliser la composition</h4>
	    <label>Support: <input type="number" id="role-support" min="0" value="1"></label>
	    <label>Healer: <input type="number" id="role-healer" min="0" value="1"></label>
	    <label>Boon: <input type="number" id="role-boon" min="0" value="1"></label>
	    <label>DPS: <input type="number" id="role-dps" min="0" value="2"></label>
	    <button onclick="updateRoles()">✅ Appliquer</button>
	  </div>
    </div>
	<hr>
	<br /><br />
    <div id="groups"></div>
    <div id="stats"></div>
    <div id="details"></div>
	<footer class="footer">
	  <p>Codé avec <span class="heart">❤️</span> par <strong>Talos.1875</strong> - Github repo <a href="https://github.com/Talos51/GW2-SquadBuilder">here</a></p>
	</footer>
  </div>

  <script>
	// Compo groupe
    const roles = ["Support", "Healer", "Boon", "DPS", "DPS"];
	// https://wiki.guildwars2.com/wiki/Guild_Wars_2_Wiki:Profession_icons
    const classes = {
		// Guard
	  Guardian: { url: "assets/classes/Guardian.png", roles: [], emoji : ":Guard:" },
	  Dragonhunter: { url: "assets/classes/Dragonhunter.png", roles: ["Support", "DPS"], emoji : ":Dragonhunter:" },
	  Firebrand: { url: "assets/classes/Firebrand.png", roles: ["Support"], emoji : ":Firebrand:" },
	  Willbender: { url: "assets/classes/Willbender.png", roles: ["DPS"], emoji : ":Willbender:" },
	  Luminary: { url: "assets/classes/Luminary.png", roles: ["Support"], emoji : ":Luminary:" },
		// Ranger
	  Ranger: { url: "assets/classes/Ranger.png", roles: ["DPS"], emoji : ":Ranger:" },
	  Druid: { url: "assets/classes/Druid.png", roles: ["Healer"], emoji : ":Druid:" },
	  Soulbeast: { url: "assets/classes/Soulbeast.png", roles: ["DPS"], emoji : ":Soulbeast:" },
	  Untamed: { url: "assets/classes/Untamed.png", roles: ["DPS"], emoji : ":Untamed:" },
	  Galeshot: { url: "assets/classes/Galeshot.png", roles: ["DPS"], emoji : ":Galeshot:" },
		// Mesmer
	  Mesmer: { url: "assets/classes/Mesmer.png", roles: ["DPS"], emoji : ":Mesmer:" },
	  Chronomancer: { url: "assets/classes/Chronomancer.png", roles: ["Support"], emoji : ":Chronomancer:" },
	  Mirage: { url: "assets/classes/Mirage.png", roles: ["DPS"], emoji : ":Mirage:" },
	  Virtuoso: { url: "assets/classes/Virtuoso.png", roles: ["DPS"], emoji : ":Virtuose:" },
	  Troubadour: { url: "assets/classes/Troubadour.png", roles: ["Support"], emoji : ":Troubadour:" },
		// Necro
	  Necromancer: { url: "assets/classes/Necromancer.png", roles: ["DPS"], emoji : ":Necro:" },
	  Reaper: { url: "assets/classes/Reaper.png", roles: ["DPS"], emoji : ":Reaper:" },
	  Scourge: { url: "assets/classes/Scourge.png", roles: ["DPS"], emoji : ":Scourge:" },
	  Harbinger: { url: "assets/classes/Harbinger.png", roles: ["Boon"], emoji : ":Harbinger:" },
	  Ritualist: { url: "assets/classes/Ritualist.png", roles: ["DPS"], emoji : ":Ritualist:" },
		// inge
	  Engineer: { url: "assets/classes/Engineer.png", roles: ["DPS"], emoji : ":Ingenieur:" },	
	  Holosmith: { url: "assets/classes/Holosmith.png", roles: ["DPS"], emoji : ":Holosmith:" },
	  Scrapper: { url: "assets/classes/Scrapper.png", roles: ["Healer"], emoji : ":Scrap:" },
	  Mechanist: { url: "assets/classes/Mechanist.png", roles: ["DPS"], emoji : ":Mecanist:" },
	  Amalgam: { url: "assets/classes/Amalgam.png", roles: ["DPS"], emoji : ":Amalgam:" },
		// War
	  Warrior: { url: "assets/classes/Warrior.png", roles: ["DPS"], emoji : ":War:" },
	  Berserker: { url: "assets/classes/Berserker.png", roles: ["DPS"], emoji : ":Berserker:" },
	  Spellbreaker: { url: "assets/classes/Spellbreaker.png", roles: ["DPS", "Boon"], emoji : ":SPB:" },
	  Bladesworn: { url: "assets/classes/Bladesworn.png", roles: ["DPS"], emoji : ":Bladesworn:" },
	  Paragon: { url: "assets/classes/Paragon.png", roles: ["Support", "Boon"], emoji : ":Paragon:" },
		// Rev
	  Revenant: { url: "assets/classes/Revenant.png", roles: ["DPS"], emoji : ":Revenant:" },
	  Herald: { url: "assets/classes/Herald.png", roles: ["DPS"], emoji : ":Herald:" },
	  Renegade: { url: "assets/classes/Renegade.png", roles: ["Boon", "DPS"], emoji : ":Renegade:" },
	  Vindicator: { url: "assets/classes/Vindicator.png", roles: ["Healer", "DPS"], emoji : ":Vindicator:" },
	  Conduit: { url: "assets/classes/Conduit.png", roles: ["DPS"], emoji : ":Conduit:" },
	    // Thief
	  Thief: { url: "assets/classes/Thief.png", roles: ["DPS"], emoji : ":Thief:" },
	  Daredevil: { url: "assets/classes/Daredevil.png", roles: ["DPS"], emoji : ":Daredevil:" },
	  Deadeye: { url: "assets/classes/Deadeye.png", roles: ["DPS"], emoji : ":Deadeye:" },
	  Specter: { url: "assets/classes/Specter.png", roles: ["Healer"], emoji : ":Specter:" },
	  Antiquary: { url: "assets/classes/Antiquary.png", roles: ["DPS"], emoji : ":Antiquaire:" },
	    // Elem
	  Elementalist: { url: "assets/classes/Elementalist.png", roles: ["DPS"], emoji : ":Elementalist:" },
	  Tempest: { url: "assets/classes/Tempest.png", roles: ["Healer"], emoji : ":Tempest:" },
	  Weaver: { url: "assets/classes/Weaver.png", roles: ["DPS"], emoji : ":Weaver:" },
	  Catalyst: { url: "assets/classes/Catalyst.png", roles: ["Boon", "DPS"], emoji : ":Catalyst:" },
	  Evoker: { url: "assets/classes/Evoker.png", roles: ["Boon", "DPS"], emoji : ":Evoker:" }
	};


    const iconsContainer = document.getElementById("icons");
    const groupsContainer = document.getElementById("groups");
    const statsContainer = document.getElementById("stats");
    const detailsContainer = document.getElementById("details");
	const FALLBACK_ICON_URL = "https://cdn-icons-png.flaticon.com/128/3781/3781609.png";
	
	function handleIconError(img) {
	  if (img.dataset.fallbackApplied === "true") return;
	  img.dataset.fallbackApplied = "true";
	  img.src = FALLBACK_ICON_URL;
	}

	function createIcon(name, data) {
	  const img = document.createElement("img");
	  img.src = data.url;
	  img.alt = name;
	  img.title = name;
	  img.className = "icon";
	  img.dataset.roles = data.roles.join(",");
	  img.draggable = true;

	  img.addEventListener("error", () => handleIconError(img));

	  img.addEventListener("dragstart", e => {
		e.dataTransfer.setData("text/plain", name);
	  });

	  iconsContainer.appendChild(img);
	}

    Object.entries(classes).forEach(([name, url]) => createIcon(name, url));

    function renderSlot(slot, className = null, pseudo = "") {
      slot.replaceChildren();
      delete slot.dataset.class;

      if (!className || !classes[className]) {
        const roleLabel = document.createElement("small");
        roleLabel.textContent = slot.dataset.role;
        slot.appendChild(roleLabel);
        return;
      }

      slot.dataset.class = className;

	  const img = document.createElement("img");
	  img.src = classes[className].url;
	  img.alt = className;
	  img.className = "icon";
	  img.draggable = false;
	  
	  img.addEventListener("error", () => handleIconError(img));

	  slot.appendChild(img);

      const nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.className = "player-name";
      nameInput.placeholder = "Pseudo";
      nameInput.setAttribute("aria-label", `Pseudo du joueur (${className})`);
      nameInput.maxLength = 64;
      nameInput.value = typeof pseudo === "string" ? pseudo : "";
      nameInput.addEventListener("input", updateStats);
      slot.appendChild(nameInput);

      const roleLabel = document.createElement("small");
      roleLabel.textContent = slot.dataset.role;
      slot.appendChild(roleLabel);
    }

    function addGroup() {
      const group = document.createElement("div");
      group.className = "group";

      const groupNumber = groupsContainer.children.length + 1;
      const numberDiv = document.createElement("div");
      numberDiv.className = "group-number";
      numberDiv.textContent = `Groupe ${groupNumber}`;
      numberDiv.style.marginRight = "10px";
      numberDiv.style.fontWeight = "bold";
      numberDiv.style.width = "80px";

      const row = document.createElement("div");
      row.style.display = "flex";
      row.style.alignItems = "center";

      row.appendChild(numberDiv);

      roles.forEach(role => {
        const slot = document.createElement("div");
        slot.className = "slot";
        slot.dataset.role = role;
        renderSlot(slot);
        slot.addEventListener("dragover", e => e.preventDefault());
        slot.addEventListener("drop", e => {
          e.preventDefault();
          const className = e.dataTransfer.getData("text/plain");
          if (classes[className]) {
            const existingPseudo = slot.querySelector(".player-name")?.value || "";
            renderSlot(slot, className, existingPseudo);
            slot.classList.add("dropped");
            setTimeout(() => slot.classList.remove("dropped"), 300);
            updateStats();
          }
        });
        row.appendChild(slot);
      });

      group.appendChild(row);
      groupsContainer.appendChild(group);
      updateStats();
    }

    function removeGroup() {
      if (groupsContainer.lastChild) {
        groupsContainer.removeChild(groupsContainer.lastChild);
        updateStats();
      }
    }

    function updateStats() {
      const allSlots = document.querySelectorAll(".slot img");
      const total = allSlots.length;
      const roleCounts = { "Support": 0, "Healer": 0, "Boon": 0, "DPS": 0 };
      const classCounts = {};

      document.querySelectorAll(".slot").forEach(slot => {
        const img = slot.querySelector("img");
        if (img) {
          const role = slot.dataset.role;
          const name = img.alt;
          roleCounts[role]++;
          classCounts[name] = (classCounts[name] || 0) + 1;
        }
      });

      statsContainer.innerHTML = `
		  <h4>Statistiques globales</h4>
		  <ul>
			<li><strong>Total joueurs :</strong> ${total}</li>
			<li><strong>Supports :</strong> ${roleCounts["Support"]}</li>
			<li><strong>Healers :</strong> ${roleCounts["Healer"]}</li>
			<li><strong>DPS :</strong> ${roleCounts["DPS"] + roleCounts["Boon"]}</li>
		  </ul>
		`;

		detailsContainer.innerHTML = `<h4>Détail par classe</h4><ul>`;
		for (const [cls, count] of Object.entries(classCounts)) {
		  detailsContainer.innerHTML += `<li>${cls} : ${count}</li>`;
		}
		detailsContainer.innerHTML += `</ul>`;
    }
	
	function filterIcons(role) {
	  const icons = iconsContainer.querySelectorAll(".icon");
	  icons.forEach(icon => {
		const roles = icon.dataset.roles.split(",");
		icon.style.display = (role === "All" || roles.includes(role)) ? "inline-block" : "none";
	  });
	}
	
	function resetGroups() {
	  document.querySelectorAll(".slot").forEach(slot => {
		renderSlot(slot);
	  });
	  updateStats();
	}
	
	function updateRoles() {
	  const support = parseInt(document.getElementById("role-support").value) || 0;
	  const healer = parseInt(document.getElementById("role-healer").value) || 0;
	  const boon = parseInt(document.getElementById("role-boon").value) || 0;
	  const dps = parseInt(document.getElementById("role-dps").value) || 0;

	  roles.length = 0;
	  roles.push(...Array(support).fill("Support"));
	  roles.push(...Array(healer).fill("Healer"));
	  roles.push(...Array(boon).fill("Boon"));
	  roles.push(...Array(dps).fill("DPS"));

	  groupsContainer.innerHTML = "";
	  for (let i = 0; i < 4; i++) addGroup();
	}


    // JSON est conservé dans le LocalStorage : Base64 augmenterait la taille des données.
    const SAVED_COMPOSITIONS_KEY = "gw2SquadBuilder.savedCompositions.v1";

    function getCompositionData() {
      const groupsData = [];
      document.querySelectorAll(".group").forEach((group, i) => {
        const composition = [];
        const pseudos = [];
        group.querySelectorAll(".slot").forEach(slot => {
          const img = slot.querySelector("img");
          composition.push(img ? img.alt : null);
          pseudos.push(img ? (slot.querySelector(".player-name")?.value.trim() || "") : "");
        });
        const groupData = { groupe: i + 1, composition };
        if (pseudos.some(pseudo => pseudo !== "")) groupData.pseudos = pseudos;
        groupsData.push(groupData);
      });
      return { groups: groupsData, customRoles: [...roles] };
    }
	
	function toggleSavedCompositions() {
      const panel = document.getElementById("saved-compositions");
      const button = document.getElementById("toggle-saved-compositions");
      const isHidden = panel.style.display === "none";

      panel.style.display = isHidden ? "block" : "none";
      button.textContent = isHidden ? "📚 Masquer les compositions" : "📚 Afficher les compositions";
      button.setAttribute("aria-expanded", String(isHidden));
    }

    function readSavedCompositions() {
      try {
        const raw = localStorage.getItem(SAVED_COMPOSITIONS_KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
      } catch (error) {
        showError("Impossible de lire les compositions sauvegardées : stockage indisponible ou données invalides.");
        return {};
      }
    }

    function writeSavedCompositions(saved) {
      try {
        localStorage.setItem(SAVED_COMPOSITIONS_KEY, JSON.stringify(saved));
        return true;
      } catch (error) {
        showError("Enregistrement impossible : stockage plein ou bloqué par le navigateur.");
        return false;
      }
    }

    function refreshSavedCompositions(selectedName = "") {
      const select = document.getElementById("saved-compositions-list");
      const saved = readSavedCompositions();
      const names = Object.keys(saved).sort((a, b) => a.localeCompare(b, "fr"));
      select.replaceChildren();
      if (!names.length) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "Aucune composition enregistrée";
        select.appendChild(option);
        select.disabled = true;
        return;
      }
      select.disabled = false;
      names.forEach(name => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
      });
      if (selectedName && names.includes(selectedName)) select.value = selectedName;
    }

    function saveCompositionToStorage() {
      const nameInput = document.getElementById("composition-name");
      const name = nameInput.value.trim();
      if (!name) {
        showError("Saisissez un nom pour cette composition.");
        nameInput.focus();
        return;
      }
      const saved = readSavedCompositions();
      if (Object.prototype.hasOwnProperty.call(saved, name) &&
          !confirm(`La composition « ${name} » existe déjà. Voulez-vous la remplacer ?`)) return;
      saved[name] = getCompositionData();
      if (writeSavedCompositions(saved)) {
        refreshSavedCompositions(name);
        showSuccess(`Composition « ${name} » enregistrée.`, 1800);
      }
    }

    function loadCompositionFromStorage() {
      const name = document.getElementById("saved-compositions-list").value;
      if (!name) {
        showError("Sélectionnez une composition à charger.");
        return;
      }
      const saved = readSavedCompositions();
      if (!Object.prototype.hasOwnProperty.call(saved, name)) {
        showError("Cette composition n'existe plus dans le stockage.");
        refreshSavedCompositions();
        return;
      }
      if (applyCompositionData(saved[name])) {
        document.getElementById("composition-name").value = name;
        showSuccess(`Composition « ${name} » chargée.`, 1800);
      }
    }

    function deleteCompositionFromStorage() {
      const select = document.getElementById("saved-compositions-list");
      const name = select.value;
      if (!name) {
        showError("Sélectionnez une composition à supprimer.");
        return;
      }
      if (!confirm(`Supprimer définitivement la composition « ${name} » de ce navigateur ?`)) return;
      const saved = readSavedCompositions();
      delete saved[name];
      if (writeSavedCompositions(saved)) {
        refreshSavedCompositions();
        if (document.getElementById("composition-name").value.trim() === name) {
          document.getElementById("composition-name").value = "";
        }
      }
    }

    function applyCompositionData(data) {
      if (!data || !Array.isArray(data.groups)) {
        showError("Composition invalide : structure de groupes manquante.");
        return false;
      }
      if (Array.isArray(data.customRoles) &&
          data.customRoles.every(role => ["Support", "Healer", "Boon", "DPS"].includes(role))) {
        roles.length = 0;
        roles.push(...data.customRoles);
        updateRoleInputsFromRoles();
      }
      updateRoles();
      resetGroups();
      data.groups.forEach((groupData, i) => {
        if (i >= groupsContainer.children.length) addGroup();
        const slots = groupsContainer.children[i].querySelectorAll(".slot");
        const composition = Array.isArray(groupData.composition) ? groupData.composition : [];
        const pseudos = Array.isArray(groupData.pseudos) ? groupData.pseudos : [];
        composition.forEach((className, j) => {
          const slot = slots[j];
          if (!slot) return;
          const pseudo = typeof pseudos[j] === "string" ? pseudos[j] : "";
          if (className && classes[className]) renderSlot(slot, className, pseudo);
          else renderSlot(slot);
        });
      });
      updateStats();
      return true;
    }

	function exportComposition() {
      const data = getCompositionData();

	  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
	  const url = URL.createObjectURL(blob);
	  const a = document.createElement("a");
	  a.href = url;
	  a.download = "composition_gw2.json";
	  a.click();
	  URL.revokeObjectURL(url);
	}

	function importComposition(event) {
	  const file = event.target.files[0];
	  if (!file) return;
	  const reader = new FileReader();

	  reader.onload = () => {
	    try {
          const data = JSON.parse(reader.result);
          applyCompositionData(data);
          event.target.value = "";
	    } catch (e) {
	      showError("Erreur lors de l'import : fichier JSON invalide.");
	      event.target.value = "";
	    }
	  };
	  reader.readAsText(file);
	}

	function updateRoleInputsFromRoles() {
	  const counts = { Support: 0, Healer: 0, Boon: 0, DPS: 0 };
	  roles.forEach(role => {
		if (counts.hasOwnProperty(role)) counts[role]++;
	  });
	  document.getElementById("role-support").value = counts.Support;
	  document.getElementById("role-healer").value = counts.Healer;
	  document.getElementById("role-boon").value = counts.Boon;
	  document.getElementById("role-dps").value = counts.DPS;
	}

	function generateDiscordMessage() {
	  const groups = document.querySelectorAll('.group');
	  const groupMessages = [];

	  groups.forEach((group, index) => {
	    const slots = group.querySelectorAll('.slot');
	    const members = [];

	    slots.forEach(slot => {
	      // Le dataset est la source principale ; l'attribut alt permet de récupérer
	      // la classe si le dataset a été perdu lors d'une ancienne manipulation DOM.
	      const className = slot.dataset.class || slot.querySelector('img')?.alt;
	      if (!className || !classes[className]) return; // Ne pas exporter :Unknown: pour un slot vide.

	      const classData = classes[className];
	      const emoji = classData.emoji || `:${className}:`;
	      // Utiliser les vrais caractères CR/LF dans la regex, sans supprimer les lettres r/n.
	      const pseudo = (slot.querySelector('.player-name')?.value || '')
	        .replace(/[\r\n]+/g, ' ')
	        .trim();
	      members.push(pseudo ? `${emoji} **${pseudo}**` : emoji);
	    });

	    groupMessages.push(`Groupe ${index + 1} : ${members.length ? members.join(' - ') : '(aucun joueur)'}`);
	  });

	  // Des retours à la ligne réels, compatibles avec le presse-papiers et Discord.
	  return groupMessages.join('\n');
	}

	document.getElementById('export-discord').addEventListener('click', () => {
	  const discordMessage = generateDiscordMessage();
	  navigator.clipboard.writeText(discordMessage)
		.then(() => alert('Message Discord copié dans le presse-papiers !'))
		.catch(err => console.error('Erreur de copie :', err));
	});

    const toggle = document.getElementById("mode-toggle");
    const body = document.body;
    if (localStorage.getItem("theme") === "dark") body.classList.add("dark-mode");

    toggle.onclick = () => {
      body.classList.toggle("dark-mode");
      localStorage.setItem("theme", body.classList.contains("dark-mode") ? "dark" : "light");
    };

    for (let i = 0; i < 4; i++) addGroup();
    refreshSavedCompositions();

	function showError(message, duration = 3000) {
	  const popup = document.getElementById("error-popup");
      if (!popup) { alert(message); return; }
	  popup.textContent = message;
	  popup.style.display = "block";
	  setTimeout(() => { popup.style.display = "none"; }, duration);
	}
	
	function showSuccess(message, duration = 3000) {
	  const popup = document.getElementById("success-popup");
      if (!popup) { alert(message); return; }
	  popup.textContent = message;
	  popup.style.display = "block";
	  setTimeout(() => { popup.style.display = "none"; }, duration);
	}
  </script>
  <div id="error-popup" style="display: none;"></div>
  <div id="success-popup" style="display: none;"></div>
</body>
</html>
